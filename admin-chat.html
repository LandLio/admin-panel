<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Chat Panel — DATA ENTRY</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #07070e;
      color: #eaeaf5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ====== TOP HEADER ====== */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: linear-gradient(135deg, #0e0e24, #131340);
      border-bottom: 1px solid rgba(124, 106, 255, 0.2);
      flex-shrink: 0;
    }

    .admin-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-logo {
      font-size: 28px;
    }

    .admin-title {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(90deg, #7c6aff, #00e094);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .admin-subtitle {
      font-size: 11px;
      color: #555570;
      font-weight: 500;
    }

    .admin-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .admin-stats {
      display: flex;
      gap: 20px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      color: #7c6aff;
    }

    .stat-label {
      font-size: 9px;
      color: #555570;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .refresh-btn {
      padding: 8px 16px;
      background: rgba(0, 224, 148, 0.1);
      border: 1px solid rgba(0, 224, 148, 0.3);
      color: #00e094;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .refresh-btn:hover {
      background: rgba(0, 224, 148, 0.2);
    }

    /* ====== MAIN LAYOUT ====== */
    .main-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ====== USER LIST SIDEBAR ====== */
    .user-sidebar {
      width: 300px;
      background: #0a0a1a;
      border-right: 1px solid rgba(124, 106, 255, 0.15);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(124, 106, 255, 0.1);
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      background: #131330;
      border: 1px solid rgba(124, 106, 255, 0.2);
      border-radius: 10px;
      color: #eaeaf5;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #7c6aff;
    }

    .search-input::placeholder {
      color: #555570;
    }

    .user-list {
      flex: 1;
      overflow-y: auto;
    }

    .user-list::-webkit-scrollbar {
      width: 4px;
    }

    .user-list::-webkit-scrollbar-thumb {
      background: rgba(124, 106, 255, 0.2);
      border-radius: 4px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    .user-item:hover {
      background: rgba(124, 106, 255, 0.06);
    }

    .user-item.active {
      background: rgba(124, 106, 255, 0.12);
      border-left: 3px solid #7c6aff;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #7c6aff, #9d8cff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-email {
      font-size: 12px;
      font-weight: 600;
      color: #d0d0ee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-last-msg {
      font-size: 10.5px;
      color: #555570;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }

    .user-time {
      font-size: 9px;
      color: #555570;
    }

    .user-unread {
      background: #ff4d6d;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-unread.hidden {
      display: none;
    }

    /* ====== CHAT AREA ====== */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0e0e20;
    }

    .chat-area-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: linear-gradient(135deg, #111130, #161645);
      border-bottom: 1px solid rgba(124, 106, 255, 0.15);
      flex-shrink: 0;
    }

    .chat-user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-user-avatar {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #7c6aff, #9d8cff);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .chat-user-name {
      font-size: 14px;
      font-weight: 700;
      color: #eaeaf5;
    }

    .chat-user-email {
      font-size: 10px;
      color: #7c6aff;
      font-weight: 500;
    }

    /* Chat Messages */
    .chat-messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-messages-area::-webkit-scrollbar {
      width: 5px;
    }

    .chat-messages-area::-webkit-scrollbar-thumb {
      background: rgba(124, 106, 255, 0.25);
      border-radius: 5px;
    }

    .msg-bubble {
      max-width: 65%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.6;
      word-wrap: break-word;
      animation: bubbleIn 0.25s ease;
    }

    @keyframes bubbleIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg-bubble.from-user {
      align-self: flex-start;
      background: linear-gradient(135deg, #1a1a45, #222260);
      border: 1px solid rgba(124, 106, 255, 0.15);
      color: #d0d0ee;
      border-bottom-left-radius: 4px;
    }

    .msg-bubble.from-admin {
      align-self: flex-end;
      background: linear-gradient(135deg, #7c6aff, #6a5be2);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-bubble .sender-label {
      font-size: 9.5px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .msg-bubble.from-user .sender-label {
      color: #9d8cff;
    }

    .msg-bubble.from-admin .sender-label {
      color: rgba(255, 255, 255, 0.7);
    }

    .msg-bubble .msg-timestamp {
      font-size: 9px;
      margin-top: 6px;
      opacity: 0.5;
    }

    .msg-bubble.from-user .msg-timestamp {
      text-align: left;
    }

    .msg-bubble.from-admin .msg-timestamp {
      text-align: right;
    }

    .msg-date-separator {
      text-align: center;
      font-size: 10px;
      color: #555570;
      padding: 8px 0;
      font-weight: 600;
    }

    /* Reply Input */
    .reply-area {
      padding: 14px 20px;
      background: #111130;
      border-top: 1px solid rgba(124, 106, 255, 0.12);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .reply-input {
      flex: 1;
      padding: 12px 18px;
      background: #0a0a1a;
      border: 1px solid rgba(124, 106, 255, 0.2);
      border-radius: 24px;
      color: #eaeaf5;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .reply-input:focus {
      border-color: #7c6aff;
      box-shadow: 0 0 12px rgba(124, 106, 255, 0.1);
    }

    .reply-input::placeholder {
      color: #555570;
    }

    .reply-send-btn {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #7c6aff, #9d8cff);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      font-family: inherit;
    }

    .reply-send-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 4px 20px rgba(124, 106, 255, 0.4);
    }

    .reply-send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    /* Empty State */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #333350;
      gap: 12px;
    }

    .empty-state-icon {
      font-size: 64px;
      opacity: 0.4;
    }

    .empty-state-text {
      font-size: 16px;
      font-weight: 600;
    }

    .empty-state-sub {
      font-size: 12px;
      color: #444460;
    }

    .no-users {
      padding: 40px 20px;
      text-align: center;
      color: #444460;
      font-size: 12px;
    }

    .no-users-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    /* Broadcast */
    .broadcast-bar {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(255, 179, 71, 0.05);
      border-top: 1px solid rgba(255, 179, 71, 0.15);
    }

    .broadcast-input {
      flex: 1;
      padding: 8px 14px;
      background: #131330;
      border: 1px solid rgba(255, 179, 71, 0.25);
      border-radius: 8px;
      color: #ffdb70;
      font-size: 11px;
      font-family: inherit;
      outline: none;
    }

    .broadcast-input::placeholder {
      color: #555540;
    }

    .broadcast-input:focus {
      border-color: #ffb347;
    }

    .broadcast-btn {
      padding: 8px 14px;
      background: linear-gradient(135deg, #ffb347, #ff8c42);
      border: none;
      border-radius: 8px;
      color: #1a1a2e;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .broadcast-btn:hover {
      opacity: 0.9;
    }

    /* Delete Button */
    .delete-chat-btn {
      padding: 8px 14px;
      background: rgba(255, 77, 109, 0.1);
      border: 1px solid rgba(255, 77, 109, 0.3);
      border-radius: 8px;
      color: #ff4d6d;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .delete-chat-btn:hover {
      background: rgba(255, 77, 109, 0.25);
    }

    .broadcast-btn:hover {
      opacity: 0.9;
    }

    /* ====== PASSWORD LOGIN SCREEN ====== */
    .password-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #07070e;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .password-screen.hidden {
      display: none;
    }

    .password-card {
      background: linear-gradient(145deg, #131330, #1a1a45);
      border: 1px solid rgba(124, 106, 255, 0.3);
      border-radius: 18px;
      padding: 40px 36px;
      width: 380px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(124, 106, 255, 0.08);
    }

    .password-icon {
      font-size: 52px;
      margin-bottom: 14px;
    }

    .password-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #7c6aff, #00e094);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .password-subtitle {
      font-size: 12px;
      color: #555570;
      margin-bottom: 24px;
    }

    .password-input {
      width: 100%;
      padding: 14px 18px;
      background: #0a0a1a;
      border: 1px solid rgba(124, 106, 255, 0.3);
      border-radius: 10px;
      color: #eaeaf5;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      text-align: center;
      letter-spacing: 3px;
    }

    .password-input:focus {
      border-color: #7c6aff;
      box-shadow: 0 0 15px rgba(124, 106, 255, 0.15);
    }

    .password-input::placeholder {
      color: #444460;
      letter-spacing: 0;
      font-size: 13px;
    }

    .password-btn {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      background: linear-gradient(135deg, #7c6aff, #9d8cff);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .password-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124, 106, 255, 0.4);
    }

    .password-error {
      margin-top: 12px;
      font-size: 12px;
      color: #ff4d6d;
      min-height: 18px;
    }
  </style>
</head>

<body>

  <!-- PASSWORD LOGIN SCREEN -->
  <div class="password-screen" id="passwordScreen">
    <div class="password-card">
      <div class="password-icon">🔐</div>
      <div class="password-title">Admin Login</div>
      <div class="password-subtitle">Admin password daalo to access chat panel</div>
      <input type="password" class="password-input" id="adminPasswordInput" placeholder="Password daalo..." autofocus>
      <button class="password-btn" id="adminLoginBtn">🔓 Unlock</button>
      <div class="password-error" id="passwordError"></div>
    </div>
  </div>

  <!-- HEADER -->
  <div class="admin-header" style="display:none;" id="mainApp">
    <div class="admin-header-left">
      <div class="admin-logo">🛡️</div>
      <div>
        <div class="admin-title">Admin Chat Panel</div>
        <div class="admin-subtitle">DATA ENTRY — Support Dashboard</div>
      </div>
    </div>
    <div class="admin-header-right">
      <div class="admin-stats">
        <div class="stat-item">
          <div class="stat-value" id="statTotalUsers">-</div>
          <div class="stat-label">Users</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statUnread" style="color:#ff4d6d;">-</div>
          <div class="stat-label">Unread</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statToday" style="color:#00e094;">-</div>
          <div class="stat-label">Today</div>
        </div>
      </div>
      <a href="admin-dashboard.html" style="padding:8px 16px;background:rgba(124,106,255,0.1);border:1px solid rgba(124,106,255,0.3);color:#7c6aff;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;font-family:inherit;">📊 Dashboard</a>
      <button class="refresh-btn" id="refreshAllBtn">🔄 Refresh</button>
    </div>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="main-layout" style="display:none;">
    <!-- USER SIDEBAR -->
    <div class="user-sidebar">
      <div class="sidebar-header">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search user email...">
      </div>
      <div class="user-list" id="userList">
        <div class="no-users">
          <div class="no-users-icon">💬</div>
          <div>Loading chats...</div>
        </div>
      </div>
      <div class="broadcast-bar">
        <input type="text" class="broadcast-input" id="broadcastInput" placeholder="📢 Sabko message bhejo..."
          maxlength="500">
        <button class="broadcast-btn" id="broadcastBtn">📢 Send All</button>
      </div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea">
      <div class="empty-state" id="emptyState">
        <div class="empty-state-icon">💬</div>
        <div class="empty-state-text">Kisi user ko select karo</div>
        <div class="empty-state-sub">Left side mein users ki list hai — click karo to chat dikhega</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pgxrlvalrgstmxyeeqso.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yRBKTItw2T5dlxYVTgG98Q_fdwP8kck";

    let allMessages = [];
    let userGroups = {};
    let selectedUser = null;
    let autoRefreshTimer = null;
    let adminPassword = '';

    document.addEventListener('DOMContentLoaded', async () => {
      // Password login
      const pwScreen = document.getElementById('passwordScreen');
      const pwInput = document.getElementById('adminPasswordInput');
      const pwBtn = document.getElementById('adminLoginBtn');
      const pwError = document.getElementById('passwordError');
      const mainApp = document.getElementById('mainApp');
      const mainLayout = document.querySelector('.main-layout');

      async function tryLogin() {
        const pw = pwInput.value.trim();
        if (!pw) { pwError.textContent = '⚠️ Password daalo!'; return; }
        pwError.textContent = '⏳ Checking...';
        pwBtn.disabled = true;
        // Test password by calling RPC
        try {
          const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/send_admin_message', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p_password: pw, p_user_email: 'test@test.com', p_message: '__auth_test__' })
          });
          const data = await res.json();
          if (data === 'SENT' || data === 'DENIED') {
            if (data === 'DENIED') {
              pwError.textContent = '❌ Galat password!';
              pwBtn.disabled = false;
              return;
            }
            // Delete test message
            try {
              await fetch(
                SUPABASE_URL + '/rest/v1/chat_messages?user_email=eq.test@test.com&message=eq.__auth_test__',
                { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Prefer': 'return=minimal' } }
              );
            } catch (e) { }
            // Success!
            adminPassword = pw;
            pwScreen.classList.add('hidden');
            mainApp.style.display = 'flex';
            mainLayout.style.display = 'flex';
            await loadAllMessages();
            startAutoRefresh();
          } else {
            pwError.textContent = '❌ RPC error. Check Supabase function.';
            pwBtn.disabled = false;
          }
        } catch (e) {
          pwError.textContent = '❌ Network error: ' + e.message;
          pwBtn.disabled = false;
        }
      }

      pwBtn.addEventListener('click', tryLogin);
      pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });

      document.getElementById('refreshAllBtn').addEventListener('click', () => loadAllMessages());
      document.getElementById('searchInput').addEventListener('input', renderUserList);
      document.getElementById('broadcastBtn').addEventListener('click', sendBroadcast);
    });

    function startAutoRefresh() {
      if (autoRefreshTimer) clearInterval(autoRefreshTimer);
      autoRefreshTimer = setInterval(() => loadAllMessages(), 10000);
    }

    async function loadAllMessages() {
      try {
        const res = await fetch(
          SUPABASE_URL + '/rest/v1/chat_messages?order=created_at.asc&limit=1000',
          { headers: { 'apikey': SUPABASE_KEY } }
        );
        allMessages = await res.json();
        if (!Array.isArray(allMessages)) allMessages = [];

        userGroups = {};
        allMessages.forEach(m => {
          if (!userGroups[m.user_email]) {
            userGroups[m.user_email] = { messages: [], unread: 0, lastMsg: null, lastTime: null };
          }
          userGroups[m.user_email].messages.push(m);
          userGroups[m.user_email].lastMsg = m.message;
          userGroups[m.user_email].lastTime = m.created_at;
          if (m.sender === 'user' && !m.is_read) {
            userGroups[m.user_email].unread++;
          }
        });

        updateStats();
        renderUserList();
        if (selectedUser) {
          // Input preserve karo — user type kar raha ho toh clear na ho
          const existingInput = document.getElementById('replyInput');
          const savedValue = existingInput ? existingInput.value : '';
          const wasFocused = existingInput && document.activeElement === existingInput;
          renderChat(selectedUser);
          const newInput = document.getElementById('replyInput');
          if (newInput && savedValue) {
            newInput.value = savedValue;
            if (wasFocused) newInput.focus();
          }
        }
      } catch (e) {
        console.error('loadAllMessages error:', e);
      }
    }

    function updateStats() {
      const totalUsers = Object.keys(userGroups).length;
      let totalUnread = 0, todayMsgs = 0;
      const todayStr = new Date().toISOString().split('T')[0];
      Object.values(userGroups).forEach(g => {
        totalUnread += g.unread;
        g.messages.forEach(m => { if (m.created_at && m.created_at.startsWith(todayStr)) todayMsgs++; });
      });
      document.getElementById('statTotalUsers').textContent = totalUsers;
      document.getElementById('statUnread').textContent = totalUnread;
      document.getElementById('statToday').textContent = todayMsgs;
    }

    function renderUserList() {
      const container = document.getElementById('userList');
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const sortedUsers = Object.keys(userGroups).sort((a, b) => {
        const ua = userGroups[a], ub = userGroups[b];
        if (ua.unread > 0 && ub.unread === 0) return -1;
        if (ub.unread > 0 && ua.unread === 0) return 1;
        return new Date(ub.lastTime || 0) - new Date(ua.lastTime || 0);
      });
      const filtered = sortedUsers.filter(email => email.toLowerCase().includes(searchVal));
      if (filtered.length === 0) {
        container.innerHTML = '<div class="no-users"><div class="no-users-icon">📭</div><div>Koi chat nahi mili</div></div>';
        return;
      }
      container.innerHTML = '';
      filtered.forEach(email => {
        const g = userGroups[email];
        const initial = email.charAt(0).toUpperCase();
        const lastMsg = g.lastMsg || '';
        const lastTime = g.lastTime ? formatTime(g.lastTime) : '';
        const isActive = selectedUser === email;
        const div = document.createElement('div');
        div.className = 'user-item' + (isActive ? ' active' : '');
        div.innerHTML = '<div class="user-avatar">' + initial + '</div>' +
          '<div class="user-info"><div class="user-email">' + escapeHtml(email) + '</div>' +
          '<div class="user-last-msg">' + escapeHtml(lastMsg.substring(0, 40)) + (lastMsg.length > 40 ? '...' : '') + '</div></div>' +
          '<div class="user-meta"><div class="user-time">' + lastTime + '</div>' +
          '<div class="user-unread ' + (g.unread === 0 ? 'hidden' : '') + '">' + g.unread + '</div></div>';
        div.addEventListener('click', () => {
          selectedUser = email;
          renderUserList();
          renderChat(email);
          markUserMessagesRead(email);
        });
        container.appendChild(div);
      });
    }

    function renderChat(email) {
      const chatArea = document.getElementById('chatArea');
      const g = userGroups[email];
      if (!g) return;
      const initial = email.charAt(0).toUpperCase();
      chatArea.innerHTML = '<div class="chat-area-header"><div class="chat-user-info">' +
        '<div class="chat-user-avatar">' + initial + '</div><div>' +
        '<div class="chat-user-name">' + escapeHtml(email) + '</div>' +
        '<div class="chat-user-email">' + g.messages.length + ' messages</div></div></div>' +
        '<button class="delete-chat-btn" id="deleteChatBtn">🗑️ Delete Chat</button></div>' +
        '<div class="chat-messages-area" id="chatMsgArea"></div>' +
        '<div class="reply-area"><input type="text" class="reply-input" id="replyInput" placeholder="Reply likho..." maxlength="500">' +
        '<button class="reply-send-btn" id="replySendBtn">➤</button></div>';

      const msgArea = document.getElementById('chatMsgArea');
      let lastDate = '';
      g.messages.forEach(m => {
        const date = new Date(m.created_at);
        const dateStr = date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'Asia/Kolkata' });
        if (dateStr !== lastDate) {
          const sep = document.createElement('div');
          sep.className = 'msg-date-separator';
          sep.textContent = '— ' + dateStr + ' —';
          msgArea.appendChild(sep);
          lastDate = dateStr;
        }
        const bubble = document.createElement('div');
        bubble.className = 'msg-bubble ' + (m.sender === 'admin' ? 'from-admin' : 'from-user');
        const timeStr = date.toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
        const senderLabel = m.sender === 'admin' ? '🛡️ You (Admin)' : '👤 User';
        bubble.innerHTML = '<div class="sender-label">' + senderLabel + '</div>' +
          '<div>' + escapeHtml(m.message) + '</div>' +
          '<div class="msg-timestamp">' + timeStr + (m.sender === 'user' ? (m.is_read ? ' ✓✓' : ' ✓') : '') + '</div>';
        msgArea.appendChild(bubble);
      });
      msgArea.scrollTop = msgArea.scrollHeight;

      document.getElementById('replySendBtn').addEventListener('click', () => sendAdminReply(email));
      document.getElementById('replyInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAdminReply(email); }
      });
      document.getElementById('deleteChatBtn').addEventListener('click', () => deleteConversation(email));
      document.getElementById('replyInput').focus();
    }

    async function sendAdminReply(email) {
      const replyInput = document.getElementById('replyInput');
      const replySendBtn = document.getElementById('replySendBtn');
      if (!replyInput) return;
      const msg = replyInput.value.trim();
      if (!msg) return;
      replySendBtn.disabled = true;
      replyInput.disabled = true;
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/send_admin_message', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_password: adminPassword, p_user_email: email, p_message: msg })
        });
        const data = await res.json();
        if (data === 'SENT') { replyInput.value = ''; await loadAllMessages(); }
        else { alert('❌ Send failed: ' + data); }
      } catch (e) { alert('❌ Network error: ' + e.message); }
      replySendBtn.disabled = false;
      replyInput.disabled = false;
      replyInput.focus();
    }

    async function deleteConversation(email) {
      if (!confirm('🗑️ "' + email + '" ki PURI chat delete karni hai?\n\nYe action undo nahi hoga!')) return;
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/delete_conversation', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_password: adminPassword, p_user_email: email })
        });
        const data = await res.json();
        console.log('Delete response:', data);
        const result = typeof data === 'string' ? data : (data && data.result ? data.result : JSON.stringify(data));
        if (result === 'DELETED' || (typeof data === 'string' && data.includes('DELETED'))) {
          selectedUser = null;
          await loadAllMessages();
          const chatArea = document.getElementById('chatArea');
          chatArea.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✅</div>' +
            '<div class="empty-state-text">Chat deleted!</div>' +
            '<div class="empty-state-sub">Kisi aur user ko select karo</div></div>';
        } else if (res.ok) {
          // RPC ran successfully even if format is different
          selectedUser = null;
          await loadAllMessages();
          const chatArea = document.getElementById('chatArea');
          chatArea.innerHTML = '<div class="empty-state"><div class="empty-state-icon">✅</div>' +
            '<div class="empty-state-text">Chat deleted!</div>' +
            '<div class="empty-state-sub">Kisi aur user ko select karo</div></div>';
        } else {
          alert('❌ Delete failed: ' + JSON.stringify(data));
        }
      } catch (e) { alert('❌ Network error: ' + e.message); }
    }

    async function markUserMessagesRead(email) {
      try {
        await fetch(
          SUPABASE_URL + '/rest/v1/chat_messages?user_email=eq.' + encodeURIComponent(email) + '&sender=eq.user&is_read=eq.false',
          { method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' }, body: JSON.stringify({ is_read: true }) }
        );
        if (userGroups[email]) {
          userGroups[email].unread = 0;
          userGroups[email].messages.forEach(m => { if (m.sender === 'user') m.is_read = true; });
          renderUserList();
          updateStats();
        }
      } catch (e) { console.error('markUserMessagesRead error:', e); }
    }

    async function sendBroadcast() {
      const input = document.getElementById('broadcastInput');
      const msg = input.value.trim();
      if (!msg) return;
      const users = Object.keys(userGroups);
      if (users.length === 0) { alert('Koi user nahi hai!'); return; }
      if (!confirm('📢 "' + msg + '" — ye ' + users.length + ' users ko bheja jayega. Confirm?')) return;
      const btn = document.getElementById('broadcastBtn');
      btn.disabled = true; btn.textContent = '⏳ Sending...';
      let sent = 0;
      for (const email of users) {
        try {
          const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/send_admin_message', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p_password: adminPassword, p_user_email: email, p_message: msg })
          });
          const data = await res.json();
          if (data === 'SENT') sent++;
        } catch (e) { }
      }
      input.value = '';
      btn.disabled = false; btn.textContent = '📢 Send All';
      alert('✅ ' + sent + '/' + users.length + ' users ko message bhej diya!');
      await loadAllMessages();
    }

    function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text || ''; return d.innerHTML; }

    function formatTime(timestamp) {
      const d = new Date(timestamp);
      const nowIST = new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata' });
      const todayStr = new Date(nowIST).toLocaleDateString('en-CA');
      const dateStr = d.toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
      if (dateStr === todayStr) return d.toLocaleString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
      return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', timeZone: 'Asia/Kolkata' });
    }
  </script>
</body>
