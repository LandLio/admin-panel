<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — DATA ENTRY</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #07070e;
      color: #eaeaf5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header */
    .dash-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 28px;
      background: linear-gradient(135deg, #0e0e24, #131340);
      border-bottom: 1px solid rgba(124,106,255,0.2);
      position: sticky; top: 0; z-index: 100;
    }
    .dash-header-left { display: flex; align-items: center; gap: 14px; }
    .dash-logo { font-size: 32px; }
    .dash-title {
      font-size: 22px; font-weight: 900;
      background: linear-gradient(90deg, #7c6aff, #00e094);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .dash-subtitle { font-size: 11px; color: #555570; font-weight: 500; }
    .dash-actions { display: flex; gap: 10px; }
    .dash-btn {
      padding: 10px 18px; border-radius: 10px; font-size: 12px;
      font-weight: 600; cursor: pointer; font-family: inherit;
      transition: all 0.2s; border: none;
    }
    .dash-btn-refresh {
      background: rgba(0,224,148,0.1); border: 1px solid rgba(0,224,148,0.3);
      color: #00e094;
    }
    .dash-btn-refresh:hover { background: rgba(0,224,148,0.2); }
    .dash-btn-chat {
      background: rgba(124,106,255,0.1); border: 1px solid rgba(124,106,255,0.3);
      color: #7c6aff; text-decoration: none; display: inline-flex; align-items: center;
    }
    .dash-btn-chat:hover { background: rgba(124,106,255,0.2); }

    /* Main Content */
    .dash-content { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }

    /* Stats Cards Row */
    .stats-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: linear-gradient(145deg, #131330, #1a1a45);
      border: 1px solid rgba(124,106,255,0.15);
      border-radius: 16px; padding: 22px;
      position: relative; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .stat-card-icon {
      font-size: 36px; margin-bottom: 12px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }
    .stat-card-value {
      font-size: 32px; font-weight: 900; margin-bottom: 4px;
    }
    .stat-card-label {
      font-size: 11px; color: #8888aa; text-transform: uppercase;
      letter-spacing: 1.5px; font-weight: 600;
    }
    .stat-card-glow {
      position: absolute; top: -30px; right: -30px;
      width: 100px; height: 100px; border-radius: 50%;
      opacity: 0.08; filter: blur(30px);
    }
    .stat-card:nth-child(1) .stat-card-value { color: #7c6aff; }
    .stat-card:nth-child(1) .stat-card-glow { background: #7c6aff; }
    .stat-card:nth-child(2) .stat-card-value { color: #00e094; }
    .stat-card:nth-child(2) .stat-card-glow { background: #00e094; }
    .stat-card:nth-child(3) .stat-card-value { color: #ffb347; }
    .stat-card:nth-child(3) .stat-card-glow { background: #ffb347; }
    .stat-card:nth-child(4) .stat-card-value { color: #ff4d6d; }
    .stat-card:nth-child(4) .stat-card-glow { background: #ff4d6d; }

    /* Two Column Layout */
    .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }

    /* Panel */
    .panel {
      background: linear-gradient(145deg, #0e0e24, #131335);
      border: 1px solid rgba(124,106,255,0.12);
      border-radius: 16px; overflow: hidden;
    }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px;
      background: rgba(124,106,255,0.04);
      border-bottom: 1px solid rgba(124,106,255,0.1);
    }
    .panel-title { font-size: 14px; font-weight: 700; color: #d0d0ee; }
    .panel-body { padding: 16px 20px; }

    /* User Table */
    .user-table { width: 100%; border-collapse: collapse; }
    .user-table th {
      text-align: left; font-size: 10px; color: #555570;
      text-transform: uppercase; letter-spacing: 1px;
      padding: 10px 12px; font-weight: 700;
      border-bottom: 1px solid rgba(124,106,255,0.1);
    }
    .user-table td {
      padding: 12px; font-size: 12px; color: #b0b0cc;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .user-table tr:hover td { background: rgba(124,106,255,0.04); }
    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 10px; font-weight: 700;
    }
    .status-active { background: rgba(0,224,148,0.12); color: #00e094; }
    .status-expired { background: rgba(255,77,109,0.12); color: #ff4d6d; }

    /* Plan Breakdown */
    .plan-bar-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .plan-bar-item:last-child { border-bottom: none; }
    .plan-bar-label { font-size: 13px; font-weight: 600; color: #d0d0ee; min-width: 80px; }
    .plan-bar-track {
      flex: 1; height: 8px; background: rgba(124,106,255,0.1);
      border-radius: 4px; overflow: hidden;
    }
    .plan-bar-fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, #7c6aff, #9d8cff);
      transition: width 0.8s ease;
    }
    .plan-bar-count { font-size: 12px; font-weight: 700; color: #7c6aff; min-width: 30px; text-align: right; }

    /* Loading */
    .loading-text { color: #555570; font-size: 13px; padding: 20px; text-align: center; }

    /* Password Screen */
    .pw-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #07070e; display: flex;
      justify-content: center; align-items: center; z-index: 9999;
    }
    .pw-screen.hidden { display: none; }
    .pw-card {
      background: linear-gradient(145deg, #131330, #1a1a45);
      border: 1px solid rgba(124,106,255,0.3);
      border-radius: 18px; padding: 40px 36px; width: 380px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .pw-icon { font-size: 52px; margin-bottom: 14px; }
    .pw-title {
      font-size: 20px; font-weight: 800; margin-bottom: 6px;
      background: linear-gradient(90deg, #7c6aff, #00e094);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .pw-sub { font-size: 12px; color: #555570; margin-bottom: 24px; }
    .pw-input {
      width: 100%; padding: 14px 18px;
      background: #0a0a1a; border: 1px solid rgba(124,106,255,0.3);
      border-radius: 10px; color: #eaeaf5; font-size: 15px;
      font-family: inherit; outline: none; text-align: center; letter-spacing: 3px;
    }
    .pw-input:focus { border-color: #7c6aff; }
    .pw-input::placeholder { color: #444460; letter-spacing: 0; font-size: 13px; }
    .pw-btn {
      width: 100%; padding: 14px; margin-top: 16px;
      background: linear-gradient(135deg, #7c6aff, #9d8cff);
      border: none; border-radius: 10px; color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .pw-btn:hover { box-shadow: 0 6px 20px rgba(124,106,255,0.4); }
    .pw-error { margin-top: 12px; font-size: 12px; color: #ff4d6d; min-height: 18px; }

    /* Responsive */
    @media (max-width: 900px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .two-cols { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      .stats-row { grid-template-columns: 1fr; }
      .dash-content { padding: 16px; }
      .dash-header { padding: 14px 16px; }
    }
  </style>
</head>
<body>

  <!-- Password Screen -->
  <div class="pw-screen" id="pwScreen">
    <div class="pw-card">
      <div class="pw-icon">📊</div>
      <div class="pw-title">Admin Dashboard</div>
      <div class="pw-sub">Password daalo to access dashboard</div>
      <input type="password" class="pw-input" id="pwInput" placeholder="Password..." autofocus>
      <button class="pw-btn" id="pwBtn">🔓 Unlock</button>
      <div class="pw-error" id="pwError"></div>
    </div>
  </div>

  <!-- Main App (hidden until login) -->
  <div id="mainApp" style="display:none;">
    <div class="dash-header">
      <div class="dash-header-left">
        <div class="dash-logo">📊</div>
        <div>
          <div class="dash-title">Admin Dashboard</div>
          <div class="dash-subtitle">DATA ENTRY — Business Overview</div>
        </div>
      </div>
      <div class="dash-actions">
        <a href="admin-chat.html" class="dash-btn dash-btn-chat">💬 Chat Panel</a>
        <button class="dash-btn dash-btn-refresh" id="refreshBtn">🔄 Refresh</button>
      </div>
    </div>

    <div class="dash-content">
      <!-- Stats Cards -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-card-glow"></div>
          <div class="stat-card-icon">👥</div>
          <div class="stat-card-value" id="totalUsers">-</div>
          <div class="stat-card-label">Total Users</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-glow"></div>
          <div class="stat-card-icon">✅</div>
          <div class="stat-card-value" id="activeUsers">-</div>
          <div class="stat-card-label">Active Plans</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-glow"></div>
          <div class="stat-card-icon">💰</div>
          <div class="stat-card-value" id="totalRevenue">-</div>
          <div class="stat-card-label">Total Revenue</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-glow"></div>
          <div class="stat-card-icon">❌</div>
          <div class="stat-card-value" id="expiredUsers">-</div>
          <div class="stat-card-label">Expired Plans</div>
        </div>
      </div>

      <!-- Two Column Layout -->
      <div class="two-cols">
        <!-- Plan Breakdown -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">📦 Plan Breakdown</div>
          </div>
          <div class="panel-body" id="planBreakdown">
            <div class="loading-text">Loading...</div>
          </div>
        </div>

        <!-- Recent Users -->
        <div class="panel">
          <div class="panel-header">
            <div class="panel-title">🆕 Recent Users</div>
          </div>
          <div class="panel-body" id="recentUsers" style="padding:0;">
            <div class="loading-text">Loading...</div>
          </div>
        </div>
      </div>

      <!-- All Users Table -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">👥 All Users</div>
          <input type="text" id="userSearch" placeholder="🔍 Search email..." style="padding:8px 14px;background:#0a0a1a;border:1px solid rgba(124,106,255,0.2);border-radius:8px;color:#eaeaf5;font-size:11px;font-family:inherit;outline:none;width:220px;">
        </div>
        <div class="panel-body" id="allUsersTable" style="padding:0;overflow-x:auto;">
          <div class="loading-text">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://pgxrlvalrgstmxyeeqso.supabase.co";
    const SUPABASE_KEY = "sb_publishable_yRBKTItw2T5dlxYVTgG98Q_fdwP8kck";
    let adminPassword = '';
    let allUsers = [];

    document.addEventListener('DOMContentLoaded', () => {
      const pwScreen = document.getElementById('pwScreen');
      const pwInput = document.getElementById('pwInput');
      const pwBtn = document.getElementById('pwBtn');
      const pwError = document.getElementById('pwError');

      async function tryLogin() {
        const pw = pwInput.value.trim();
        if (!pw) { pwError.textContent = '⚠️ Password daalo!'; return; }
        pwError.textContent = '⏳ Checking...';
        pwBtn.disabled = true;
        try {
          const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/send_admin_message', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p_password: pw, p_user_email: 'test@test.com', p_message: '__auth_test__' })
          });
          const data = await res.json();
          if (data === 'DENIED') {
            pwError.textContent = '❌ Galat password!';
            pwBtn.disabled = false;
            return;
          }
          // Delete test msg
          try { await fetch(SUPABASE_URL + '/rest/v1/chat_messages?user_email=eq.test@test.com&message=eq.__auth_test__', { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY } }); } catch(e){}
          adminPassword = pw;
          pwScreen.classList.add('hidden');
          document.getElementById('mainApp').style.display = 'block';
          await loadDashboard();
        } catch(e) {
          pwError.textContent = '❌ Network error';
          pwBtn.disabled = false;
        }
      }

      pwBtn.addEventListener('click', tryLogin);
      pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); });
      document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
      document.getElementById('userSearch').addEventListener('input', renderAllUsers);
    });

    async function loadDashboard() {
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_admin_dashboard', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_password: adminPassword })
        });
        const data = await res.json();
        if (data && data.error === 'DENIED') { alert('❌ Access denied!'); return; }
        allUsers = Array.isArray(data) ? data : (data ? [data] : []);
        // Filter out nulls
        allUsers = allUsers.filter(u => u && u.email);

        const now = new Date();
        const totalUsers = allUsers.length;
        let activeCount = 0, expiredCount = 0, totalRevenue = 0;
        const planCounts = {};

        allUsers.forEach(u => {
          const expiry = u.expiry_date ? new Date(u.expiry_date) : null;
          const isActive = u.credits > 0 && (!expiry || expiry >= now);
          if (isActive) activeCount++;
          else expiredCount++;

          const plan = u.plan || '0';
          const planNum = parseInt(plan) || 0;
          if (planNum > 0) totalRevenue += planNum;

          const planLabel = '₹' + (plan || '0');
          planCounts[planLabel] = (planCounts[planLabel] || 0) + 1;
        });

        document.getElementById('totalUsers').textContent = totalUsers;
        document.getElementById('activeUsers').textContent = activeCount;
        document.getElementById('totalRevenue').textContent = '₹' + totalRevenue.toLocaleString();
        document.getElementById('expiredUsers').textContent = expiredCount;

        renderPlanBreakdown(planCounts, totalUsers);
        renderRecentUsers();
        renderAllUsers();
      } catch(e) {
        console.error('loadDashboard error:', e);
      }
    }

    function renderPlanBreakdown(planCounts, total) {
      const container = document.getElementById('planBreakdown');
      const sorted = Object.entries(planCounts).sort((a, b) => b[1] - a[1]);
      if (sorted.length === 0) { container.innerHTML = '<div class="loading-text">Koi plan nahi</div>'; return; }
      container.innerHTML = '';
      sorted.forEach(([plan, count]) => {
        const pct = total > 0 ? Math.round((count / total) * 100) : 0;
        const div = document.createElement('div');
        div.className = 'plan-bar-item';
        div.innerHTML = '<div class="plan-bar-label">' + plan + '</div>' +
          '<div class="plan-bar-track"><div class="plan-bar-fill" style="width:' + pct + '%"></div></div>' +
          '<div class="plan-bar-count">' + count + '</div>';
        container.appendChild(div);
      });
    }

    function renderRecentUsers() {
      const container = document.getElementById('recentUsers');
      const recent = allUsers.slice(0, 8);
      if (recent.length === 0) { container.innerHTML = '<div class="loading-text">Koi user nahi</div>'; return; }
      let html = '<table class="user-table"><thead><tr><th>Email</th><th>Plan</th><th>Joined</th></tr></thead><tbody>';
      recent.forEach(u => {
        const joined = u.created_at ? new Date(u.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) : '-';
        html += '<tr><td>' + escapeHtml(u.email) + '</td>' +
          '<td>₹' + (u.plan || '0') + '</td>' +
          '<td>' + joined + '</td></tr>';
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function renderAllUsers() {
      const container = document.getElementById('allUsersTable');
      const searchVal = (document.getElementById('userSearch').value || '').toLowerCase().trim();
      const now = new Date();
      const filtered = allUsers.filter(u => u.email.toLowerCase().includes(searchVal));
      if (filtered.length === 0) { container.innerHTML = '<div class="loading-text">Koi user nahi mila</div>'; return; }
      let html = '<table class="user-table"><thead><tr><th>Email</th><th>Plan</th><th>Credits</th><th>Expiry</th><th>Status</th><th>Joined</th></tr></thead><tbody>';
      filtered.forEach(u => {
        const expiry = u.expiry_date ? new Date(u.expiry_date) : null;
        const isActive = u.credits > 0 && (!expiry || expiry >= now);
        const expiryStr = expiry ? expiry.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
        const joined = u.created_at ? new Date(u.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
        const statusBadge = isActive
          ? '<span class="status-badge status-active">Active</span>'
          : '<span class="status-badge status-expired">Expired</span>';
        html += '<tr><td>' + escapeHtml(u.email) + '</td>' +
          '<td>₹' + (u.plan || '0') + '</td>' +
          '<td>' + (u.credits || 0).toLocaleString() + '</td>' +
          '<td>' + expiryStr + '</td>' +
          '<td>' + statusBadge + '</td>' +
          '<td>' + joined + '</td></tr>';
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text || ''; return d.innerHTML; }
  </script>
</body>
</html>
